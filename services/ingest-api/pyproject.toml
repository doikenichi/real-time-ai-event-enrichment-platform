[project]
name = "ingest-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["fastapi>=0.165.0"]

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"
